[package]
name = "zjnu-staff-football"
version = "0.1.0"
description = "浙师大教工约球"
authors = ["ZJNU Staff Football"]
edition = "2021"

[lib]
name = "zjnu_staff_football_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
