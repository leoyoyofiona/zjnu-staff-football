services:
  - type: web
    name: zjnu-staff-football
    runtime: node
    plan: starter
    buildCommand: npm ci --ignore-scripts && npm run build
    startCommand: npm run start
    disk:
      name: football-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/football-state.json
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
